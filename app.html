<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Nusantara ERP — penjualan, pembelian, persediaan, kas & bank, dan akuntansi dalam satu aplikasi">
  <meta name="theme-color" content="#06845c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Nusantara ERP</title>

  <!-- PWA & Icons -->
  <link rel="icon" type="image/png" href="/logo-nusantara-sq.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">

  <!-- Fonts: Geist for the interface (tabular figures), Geist Mono for
       document numbers and account codes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">

  <!-- Theme Initialization (external file so CSP script-src stays 'self';
       deliberately render-blocking so the theme applies before first paint) -->
  <script src="/theme-init.js"></script>

  <!-- Styles -->
  <!-- NOTE: keep mobile.css after style.css and WITHOUT a media attribute.
       Vite bundles plain stylesheet links into main-*.css in document order,
       but a link with `media=` is emitted separately at its original position
       — which lands BEFORE the injected main-*.css bundle, so desktop rules
       in style.css would override the mobile overrides in production. -->
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/mobile.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke konten</a>

  <!-- ============================================
       LOGIN SCREEN
       ============================================ -->
  <div id="login-screen" class="login-screen" style="display: none;">
    <button class="theme-toggle login-theme-toggle" id="login-theme-toggle" type="button" aria-label="Ganti tema terang atau gelap" title="Ganti tema">
      <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="12" y1="2" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22"></line>
        <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
        <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
        <line x1="2" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22" y2="12"></line>
        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
        <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
      </svg>
      <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="login-wrap">
      <div class="login-panel">
        <div class="login-brand">
          <img class="login-logo" src="/logo-nusantara-sq.png" alt="">
          <h1 class="login-title">Nusantara ERP</h1>
          <p class="login-sub">Masuk untuk melanjutkan</p>
        </div>

        <form id="login-form" class="login-card">
          <div class="form-group">
            <label class="form-label" for="login-email">Nama pengguna</label>
            <input class="form-input" type="text" id="login-email" required autocomplete="username" autocapitalize="none" spellcheck="false">
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="input-affix">
              <input class="form-input" type="password" id="login-password" required autocomplete="current-password">
              <button type="button" id="login-toggle-pw" class="input-affix-btn" tabindex="-1" title="Tampilkan password" aria-label="Tampilkan password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div id="login-2fa-group" class="form-group" style="display: none;">
            <label class="form-label" for="login-2fa">Kode verifikasi (2FA)</label>
            <input class="form-input login-code" type="text" id="login-2fa" inputmode="numeric" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" placeholder="6 digit atau kode cadangan">
          </div>

          <div id="login-error" class="login-error" role="alert" style="display: none;"></div>

          <button type="submit" class="btn-primary login-submit">Masuk</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ============================================
       MAIN APPLICATION
       ============================================ -->
  <div id="app-container" style="display: none;">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="logo-icon"><img src="/logo-nusantara-sq.png" alt=""></span>
        <span class="sidebar-brand">Nusantara ERP</span>
      </div>

      <nav class="sidebar-nav" id="nav" aria-label="Navigasi utama">
        <!-- Rendered by public/classic/ui/nav.js (MENU_CONFIG) -->
      </nav>

      <div class="sidebar-foot">
        <button class="sidebar-collapse" id="sidebar-collapse" type="button" aria-label="Ciutkan menu" title="Ciutkan menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
          <span class="nav-label">Ciutkan menu</span>
        </button>
      </div>
    </aside>

    <!-- Mobile drawer backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <main class="main">

      <header class="topbar">
        <button class="hamburger" id="hamburger" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <!-- Active group › page (ui/nav.js) -->
        <div class="page-context" id="page-context"></div>

        <div class="search-wrap" id="search-wrap" role="search">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input class="search-input" id="search-input" type="search" placeholder="Cari transaksi, laporan…" aria-label="Cari">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
        </div>

        <div class="topbar-right">
          <button class="db-status-chip" id="db-status-chip" type="button" aria-label="Tempat penyimpanan data" title="Memuat…">
            <span class="db-status-dot" id="db-status-dot"></span>
            <span class="db-status-label" id="db-status-label">…</span>
          </button>

          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Ganti tema terang atau gelap" title="Ganti tema">
            <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <line x1="12" y1="2" x2="12" y2="4"></line>
              <line x1="12" y1="20" x2="12" y2="22"></line>
              <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
              <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
              <line x1="2" y1="12" x2="4" y2="12"></line>
              <line x1="20" y1="12" x2="22" y2="12"></line>
              <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
              <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
            </svg>
            <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <button class="notif" id="notif-btn" type="button" aria-label="Notifikasi" title="Notifikasi">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notif-dot" style="display: none;"></span>
          </button>

          <button class="user-chip" id="user-menu-btn" type="button" aria-label="Menu pengguna" aria-haspopup="menu">
            <span class="avatar-xs" id="topbar-avatar">U</span>
            <span id="topbar-username">Pengguna</span>
          </button>

          <!-- Mobile overflow button (hidden on desktop) -->
          <button class="topbar-overflow" id="topbar-overflow" type="button" aria-label="Opsi lainnya" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="5" r="1"></circle>
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="12" cy="19" r="1"></circle>
            </svg>
          </button>
        </div>

        <!-- Mobile overflow menu panel -->
        <div class="topbar-overflow-menu" id="topbar-overflow-menu">
          <button class="overflow-item" id="overflow-theme-toggle" type="button">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <line x1="12" y1="2" x2="12" y2="4"></line>
              <line x1="12" y1="20" x2="12" y2="22"></line>
              <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
              <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
              <line x1="2" y1="12" x2="4" y2="12"></line>
              <line x1="20" y1="12" x2="22" y2="12"></line>
              <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
              <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
            </svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span class="overflow-label">Ganti Tema</span>
          </button>
          <button class="overflow-item" id="overflow-notif-btn" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="overflow-label">Notifikasi</span>
          </button>
          <button class="overflow-item" id="overflow-user-btn" type="button">
            <span class="avatar-xs" id="overflow-avatar">U</span>
            <span class="overflow-label" id="overflow-username">Pengguna</span>
          </button>
        </div>
      </header>

      <!-- Content Area -->
      <div class="content" id="main-content" role="main" tabindex="-1">
        <div id="view-dashboard" class="view active"></div>
        <div id="view-sales" class="view"></div>
        <div id="view-purchase" class="view"></div>
        <div id="view-inventory" class="view"></div>
        <div id="view-finance" class="view"></div>
        <div id="view-logistics" class="view"></div>
        <div id="view-master" class="view"></div>
        <div id="view-reports" class="view"></div>
        <div id="view-settings" class="view"></div>
        <div id="view-ledger" class="view"></div>
        <div id="view-adjustments" class="view"></div>
        <div id="view-invoices" class="view"></div>
        <div id="view-assets" class="view"></div>
        <div id="view-tax" class="view"></div>
        <div id="view-financials" class="view"></div>
        <div id="view-quotations" class="view"></div>
        <div id="view-returns" class="view"></div>
        <div id="view-warehouse" class="view"></div>
        <div id="view-excelImport" class="view"></div>
        <div id="view-entriHarian" class="view"></div>
        <div id="view-pickups" class="view"></div>
      </div>
    </main>
  </div>

  <!-- ============================================
       GLOBAL CONTAINERS
       ============================================ -->
  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>
  <div id="modal-container"></div>

  <!-- ============================================
       SCRIPTS
       ============================================ -->
  <script type="module" src="/src/main.js"></script>

  <!-- Mobile UI wiring: hamburger sidebar drawer + topbar overflow menu
       (external file so the CSP script-src stays 'self') -->
  <script src="/mobile-ui.js"></script>
</body>
</html>
